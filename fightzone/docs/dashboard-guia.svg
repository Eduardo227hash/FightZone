<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Guia visual do painel FightZone</title>
  <desc id="desc">Ilustração da dashboard com menu lateral, boas-vindas, cartões de métricas, resumo do estoque e acessos rápidos.</desc>
  <defs>
    <style>
      .ink{fill:#171816}.paper{fill:#f4f1eb}.white{fill:#fffefa}.red{fill:#d8432e}.muted{fill:#777870}.side{fill:#dedbd4}.title{fill:#171816;font:bold 20px Arial,sans-serif}.label{fill:#777870;font:bold 11px Arial,sans-serif;letter-spacing:1px}.value{fill:#171816;font:bold 25px Arial,sans-serif}.small{fill:#777870;font:12px Arial,sans-serif}.menu{fill:#d8d6ce;font:14px Arial,sans-serif}.heroText{fill:#fffefa;font:bold 25px Arial,sans-serif}.heroSub{fill:#d8d6ce;font:13px Arial,sans-serif}.pill{fill:#f4f1eb;stroke:#dedbd4}
    </style>
  </defs>
  <rect class="paper" width="960" height="540" rx="18"/>
  <rect class="ink" width="210" height="540" rx="18"/>
  <rect class="red" x="24" y="24" width="38" height="38" rx="4"/>
  <text x="32" y="49" fill="#fff" font-family="Arial" font-size="15" font-weight="bold">FZ</text>
  <text x="74" y="42" fill="#fff" font-family="Arial" font-size="15" font-weight="bold">FIGHTZONE</text>
  <text x="74" y="57" fill="#aaa99f" font-family="Arial" font-size="8" letter-spacing="1">PAINEL DE GESTÃO</text>
  <text class="label" x="24" y="103" fill="#aaa99f">MENU PRINCIPAL</text>
  <rect x="16" y="119" width="178" height="38" rx="5" fill="#343530"/>
  <rect class="red" x="16" y="119" width="3" height="38"/>
  <text class="menu" x="34" y="143" fill="#fff">Visão geral</text>
  <text class="menu" x="34" y="190">Produtos e estoque</text>
  <text class="menu" x="34" y="235">Entradas de estoque</text>
  <text class="menu" x="34" y="280">Categorias</text>
  <text class="menu" x="34" y="325">Pedidos</text>
  <text class="menu" x="34" y="370">Relatórios</text>
  <text class="label" x="244" y="42">FIGHTZONE / PAINEL</text>
  <text class="title" x="244" y="71" font-size="28">Visão geral</text>
  <rect class="white" x="244" y="95" width="690" height="150" rx="4"/>
  <rect class="ink" x="244" y="95" width="690" height="150" rx="4"/>
  <text class="label" x="274" y="127" fill="#ed7965">DATA • ADMINISTRADOR</text>
  <text class="heroText" x="274" y="164">Bem-vindo ao painel.</text>
  <text class="heroSub" x="274" y="187">Acompanhe pedidos e mantenha o estoque em dia.</text>
  <rect class="red" x="274" y="204" width="152" height="28" rx="2"/>
  <text x="287" y="223" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">Gerenciar produtos</text>
  <text class="label" x="244" y="278">RESUMO DA OPERAÇÃO • VALORES ILUSTRATIVOS</text>
  <g>
    <rect class="white" x="244" y="291" width="328" height="84" stroke="#dedbd4"/>
    <rect class="white" x="586" y="291" width="348" height="84" stroke="#dedbd4"/>
    <rect class="white" x="244" y="387" width="328" height="84" stroke="#dedbd4"/>
    <rect class="white" x="586" y="387" width="348" height="84" stroke="#dedbd4"/>
    <text class="small" x="264" y="316">Pedidos no mês</text><text class="value" x="264" y="350">12</text>
    <text class="small" x="606" y="316">Faturamento confirmado</text><text class="value" x="606" y="350">R$ 0,00</text>
    <text class="small" x="264" y="412">Aguardando pagamento</text><text class="value" x="264" y="446">3</text>
    <text class="small" x="606" y="412">Estoque baixo</text><text class="value" x="606" y="446">2</text>
  </g>
  <text class="small" x="244" y="510">Use o menu lateral para abrir produtos, entradas, pedidos e relatórios.</text>
</svg>