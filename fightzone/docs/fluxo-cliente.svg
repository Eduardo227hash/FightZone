<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de compra na FightZone</title>
  <desc id="desc">O cliente cria uma conta ou entra, escolhe produtos, calcula o frete, informa entrega e pagamento e baixa o comprovante do pedido.</desc>
  <defs>
    <style>
      .bg{fill:#f4f1eb}.card{fill:#fffefa;stroke:#dedbd4;stroke-width:2}.step{fill:#171816;font:700 20px Arial,sans-serif}.sub{fill:#777870;font:14px Arial,sans-serif}.num{fill:#d8432e;font:bold 13px Arial,sans-serif}.arrow{fill:none;stroke:#d8432e;stroke-width:3;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d8432e"/></marker>
  </defs>
  <rect class="bg" width="960" height="250" rx="18"/>
  <g transform="translate(24 63)">
    <rect class="card" width="158" height="124" rx="12"/>
    <text class="num" x="18" y="28">01</text><text class="step" x="18" y="61">Crie sua</text><text class="step" x="18" y="86">conta</text><text class="sub" x="18" y="109">ou entre</text>
  </g>
  <path class="arrow" d="M190 125h24"/>
  <g transform="translate(222 63)">
    <rect class="card" width="158" height="124" rx="12"/>
    <text class="num" x="18" y="28">02</text><text class="step" x="18" y="61">Escolha</text><text class="step" x="18" y="86">produtos</text><text class="sub" x="18" y="109">e adicione</text>
  </g>
  <path class="arrow" d="M388 125h24"/>
  <g transform="translate(420 63)">
    <rect class="card" width="158" height="124" rx="12"/>
    <text class="num" x="18" y="28">03</text><text class="step" x="18" y="61">Revise o</text><text class="step" x="18" y="86">carrinho</text><text class="sub" x="18" y="109">e estime frete</text>
  </g>
  <path class="arrow" d="M586 125h24"/>
  <g transform="translate(618 63)">
    <rect class="card" width="158" height="124" rx="12"/>
    <text class="num" x="18" y="28">04</text><text class="step" x="18" y="61">Informe</text><text class="step" x="18" y="86">entrega</text><text class="sub" x="18" y="109">e pagamento</text>
  </g>
  <path class="arrow" d="M784 125h24"/>
  <g transform="translate(816 63)">
    <rect class="card" width="120" height="124" rx="12"/>
    <text class="num" x="18" y="28">05</text><text class="step" x="18" y="61">Baixe o</text><text class="step" x="18" y="86">PDF</text><text class="sub" x="18" y="109">comprovante</text>
  </g>
</svg>