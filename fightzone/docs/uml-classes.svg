<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">UML simplificado de classes de domínio da FightZone</title>
  <desc id="desc">Diagrama UML de classes para usuário, cliente, categoria, produto, pedido, item de pedido e movimentação de estoque, com relações principais.</desc>
  <defs>
    <style>
      .bg{fill:#f4f1eb}.box{fill:#fffefa;stroke:#171816;stroke-width:2}.head{fill:#171816}.headtxt{fill:#fffefa;font:bold 17px Arial,sans-serif}.txt{fill:#252a32;font:14px Arial,sans-serif}.line{stroke:#d8432e;stroke-width:2;fill:none}.mult{fill:#a92d20;font:bold 13px Arial,sans-serif}.title{fill:#171816;font:bold 22px Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1100" height="720" rx="18"/>
  <text class="title" x="550" y="38" text-anchor="middle">UML • Classes de domínio (visão simplificada)</text>
  <g transform="translate(35 90)">
    <rect class="box" width="240" height="185" rx="7"/><path class="head" d="M0 7a7 7 0 0 1 7-7h226a7 7 0 0 1 7 7v34H0z"/>
    <text class="headtxt" x="120" y="27" text-anchor="middle">Usuario</text>
    <text class="txt" x="14" y="65">+ id: int</text><text class="txt" x="14" y="88">+ nome: string</text><text class="txt" x="14" y="111">+ email: string</text><text class="txt" x="14" y="134">+ perfil: enum</text><text class="txt" x="14" y="157">+ ativo: bool</text>
  </g>
  <g transform="translate(35 415)">
    <rect class="box" width="240" height="195" rx="7"/><path class="head" d="M0 7a7 7 0 0 1 7-7h226a7 7 0 0 1 7 7v34H0z"/>
    <text class="headtxt" x="120" y="27" text-anchor="middle">Cliente</text>
    <text class="txt" x="14" y="65">+ usuario_id: int</text><text class="txt" x="14" y="88">+ cpf: string?</text><text class="txt" x="14" y="111">+ telefone: string?</text><text class="txt" x="14" y="134">+ cep: string?</text><text class="txt" x="14" y="157">+ endereco: dados</text><text class="txt" x="14" y="180">+ cidade / uf</text>
  </g>
  <g transform="translate(400 90)">
    <rect class="box" width="250" height="185" rx="7"/><path class="head" d="M0 7a7 7 0 0 1 7-7h236a7 7 0 0 1 7 7v34H0z"/>
    <text class="headtxt" x="125" y="27" text-anchor="middle">Categoria</text>
    <text class="txt" x="14" y="65">+ id: int</text><text class="txt" x="14" y="88">+ nome: string</text><text class="txt" x="14" y="111">+ slug: string</text><text class="txt" x="14" y="134">+ ativo: bool</text><text class="txt" x="14" y="163">+ ativar / inativar()</text>
  </g>
  <g transform="translate(400 415)">
    <rect class="box" width="250" height="195" rx="7"/><path class="head" d="M0 7a7 7 0 0 1 7-7h236a7 7 0 0 1 7 7v34H0z"/>
    <text class="headtxt" x="125" y="27" text-anchor="middle">Produto</text>
    <text class="txt" x="14" y="65">+ id: int</text><text class="txt" x="14" y="88">+ categoria_id: int</text><text class="txt" x="14" y="111">+ nome / sku: string</text><text class="txt" x="14" y="134">+ preco / estoque</text><text class="txt" x="14" y="157">+ peso / dimensoes</text><text class="txt" x="14" y="180">+ ativo: bool</text>
  </g>
  <g transform="translate(810 90)">
    <rect class="box" width="250" height="195" rx="7"/><path class="head" d="M0 7a7 7 0 0 1 7-7h236a7 7 0 0 1 7 7v34H0z"/>
    <text class="headtxt" x="125" y="27" text-anchor="middle">Pedido</text>
    <text class="txt" x="14" y="65">+ id: int</text><text class="txt" x="14" y="88">+ usuario_id: int</text><text class="txt" x="14" y="111">+ subtotal / frete / total</text><text class="txt" x="14" y="134">+ status: enum</text><text class="txt" x="14" y="157">+ pagamento: enum</text><text class="txt" x="14" y="180">+ endereco / criado_em</text>
  </g>
  <g transform="translate(810 415)">
    <rect class="box" width="250" height="150" rx="7"/><path class="head" d="M0 7a7 7 0 0 1 7-7h236a7 7 0 0 1 7 7v34H0z"/>
    <text class="headtxt" x="125" y="27" text-anchor="middle">ItemPedido</text>
    <text class="txt" x="14" y="65">+ pedido_id: int</text><text class="txt" x="14" y="88">+ produto_id: int</text><text class="txt" x="14" y="111">+ produto_nome / qtd.</text><text class="txt" x="14" y="134">+ preco_unitario</text>
  </g>
  <g transform="translate(400 640)">
    <rect class="box" width="250" height="62" rx="7"/><path class="head" d="M0 7a7 7 0 0 1 7-7h236a7 7 0 0 1 7 7v34H0z"/>
    <text class="headtxt" x="125" y="27" text-anchor="middle">MovimentoEstoque</text>
    <text class="txt" x="125" y="56" text-anchor="middle">produto • tipo • quantidade • responsavel</text>
  </g>
  <g class="line">
    <path d="M155 275v140"/><path d="M275 180h125M525 275v140M650 510h160M935 285v130"/>
    <path d="M525 610v30"/>
  </g>
  <g class="mult">
    <text x="164" y="295">1</text><text x="164" y="405">*</text>
    <text x="285" y="170">1</text><text x="385" y="170">*</text>
    <text x="535" y="300">1</text><text x="535" y="405">*</text>
    <text x="665" y="500">1</text><text x="785" y="500">*</text>
    <text x="945" y="305">1</text><text x="945" y="405">*</text>
    <text x="535" y="625">1</text><text x="535" y="638">*</text>
  </g>
</svg>
